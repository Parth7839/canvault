<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Can Vault</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0f0a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Can Vault">
<style>
:root{--bg:#fafaf8;--ink:#161816;--mute:#7b817c;--line:#e6e8e4;--acc:#161816;--acc-ink:#fafaf8;--ph:#eef0ec;
--common:#9aa09b;--uncommon:#3f9a64;--rare:#3b78d8;--epic:#8f55d6;--legendary:#d98a00;color-scheme:light dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e100e;--ink:#eceeea;--mute:#8a918b;--line:#222622;--acc:#eceeea;--acc-ink:#0e100e;--ph:#181b18;--common:#9aa59c;--uncommon:#46c27d;--rare:#5b9bff;--epic:#b57aff;--legendary:#ffb12e}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:620px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 20px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
#sum{color:var(--mute);font-size:14px}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;color:var(--ink);background:none}
.primary{background:var(--acc);color:var(--acc-ink);font-weight:600;width:100%;padding:16px}
.link{color:var(--mute);width:100%;padding:10px;font-size:14px}
.danger{color:#d23b3b}
:focus-visible{outline:2px solid var(--rare);outline-offset:2px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools{display:grid;grid-template-columns:1fr 110px;gap:8px;margin:18px 0 10px}
.filters{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chip{padding:6px 12px;border-radius:99px;white-space:nowrap;font-size:14px;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px}
.card{text-align:left;padding:0;display:block;width:100%;background:none;border-radius:0}
.ph{aspect-ratio:3/4;background:var(--ph);position:relative;display:flex;align-items:center;justify-content:center;font-size:36px;border-radius:12px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.wish{position:absolute;right:6px;top:6px;background:#000a;color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.info{padding:8px 2px 0}
.info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:15px}
.info span{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.empty{color:var(--mute);text-align:center;padding:36px 0;grid-column:1/-1}
.scan{position:absolute;inset:0;background:#000a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
details{border-top:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;color:var(--mute);font-size:14px;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:10px}
.bar{display:grid;grid-template-columns:96px 1fr 72px;gap:8px;align-items:center;font-size:14px;margin:8px 0}
.track{background:var(--line);border-radius:4px;height:6px;overflow:hidden}
.fill{height:100%;border-radius:4px}
.bar small{color:var(--mute);text-align:right}
.note{color:var(--mute);font-size:13px}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.panel img{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--ph)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:70;display:none;max-width:90%}
#cam{position:fixed;inset:0;background:#000;z-index:40;display:none}
#cam.open{display:block}
#vid{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:12%;right:12%;top:18%;bottom:30%;border:2px solid #fff8;border-radius:18px;pointer-events:none}
.camtop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.camtop span{background:#0008;padding:6px 12px;border-radius:99px;font-size:14px}
.camtop button{background:#0008;color:#fff;border-radius:99px;padding:8px 14px}
.hint{position:absolute;left:0;right:0;top:calc(18% - 32px);text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 4px #000}
.camctl{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:center}
.camctl button{background:#0008;color:#fff;border-radius:99px;padding:14px 16px;font-size:20px}
.shut{width:72px;height:72px;border-radius:50%!important;background:#fff!important;border:4px solid #fff8!important;padding:0!important;background-clip:padding-box!important}
.shut:active{transform:scale(.94)}
.tray{position:absolute;left:12px;right:12px;bottom:calc(116px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.res{display:flex;gap:10px;align-items:center;background:#000d;border-radius:14px;padding:8px;color:#fff;text-align:left;width:100%}
.res img{width:44px;height:56px;object-fit:cover;border-radius:8px}
.res div{flex:1;min-width:0}
.res b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res small{font-weight:600}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .25s}
@keyframes fl{from{opacity:.8}to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header><h1>Can Vault</h1><span id="sum"></span></header>

<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<button class="primary" id="scanBtn">Scan a can</button>
<button class="link" id="gal">Upload from gallery</button>

<div class="tools">
<input id="q" type="search" placeholder="Search" aria-label="Search cans">
<select id="sort" aria-label="Sort"><option value="new">Newest</option><option value="price">Price</option><option value="rarity">Rarity</option><option value="name">Name</option></select>
</div>
<div class="filters" id="filters"></div>
<div class="grid" id="list"></div>
<button class="link" id="manual" style="margin-top:16px">Add without a photo</button>

<details style="margin-top:20px"><summary>Value by rarity</summary><div id="chart"></div></details>
<details><summary>Backup</summary>
<p class="note">Cans are saved on this phone. Export a backup so you never lose them.</p>
<div class="row"><button style="border:1px solid var(--line)" id="exp">Export</button><button style="border:1px solid var(--line)" id="imp">Import</button></div>
<input type="file" id="impFile" accept="application/json" hidden>
</details>
</main>

<div id="cam">
<video id="vid" playsinline muted></video>
<div class="frame"></div>
<div class="hint">Fit the whole can in the frame</div>
<div class="camtop"><span id="camCount">0 scanned</span><button id="camClose">Done</button></div>
<div class="tray" id="tray"></div>
<div class="camctl"><button id="camGal" aria-label="Upload from gallery">🖼️</button><button class="shut" id="shutter" aria-label="Take photo"></button><span style="width:52px"></span></div>
<div class="flash" id="flash"></div>
</div>

<div id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
const RAR=["Common","Uncommon","Rare","Epic","Legendary"];
const COL={Common:"var(--common)",Uncommon:"var(--uncommon)",Rare:"var(--rare)",Epic:"var(--epic)",Legendary:"var(--legendary)"};
const $=id=>document.getElementById(id);
let cans=[],filter="All",editId=null,stream=null,camScans=0;
try{cans=JSON.parse(localStorage.getItem("canvault")||"[]")}catch(e){cans=[]}
function save(){try{localStorage.setItem("canvault",JSON.stringify(cans));return true}catch(e){toast("Storage is full. Export a backup and delete some cans.");return false}}
const money=n=>"₹"+(+n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
function drawTo(img,max,q){const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const o={scan:drawTo(img,1280,.85),thumb:drawTo(img,480,.7)};URL.revokeObjectURL(u);res(o)};img.onerror=rej;img.src=u})}

const queue=[];let running=0;
function enqueue(fn){queue.push(fn);pump()}
function pump(){while(running<2&&queue.length){running++;queue.shift()().catch(()=>{}).finally(()=>{running--;pump()})}}
async function callScan(image){
 const r=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image})});
 const j=await r.json();if(!r.ok)throw new Error(j.error||"Scan failed");return j;
}
async function scanOne(item,image){
 try{
  let j;try{j=await callScan(image)}catch(e){await new Promise(r=>setTimeout(r,5000));j=await callScan(image)}
  item.name=j.name||"Unknown can";item.line=j.line||"";item.edition=j.edition||"";
  item.rarity=RAR.includes(j.rarity)?j.rarity:"Common";item.price=Math.max(0,+j.price||0);
  item.notes=j.notes||"";item.conf=Math.round(+j.confidence||0);
 }catch(e){item.name="Unknown can";item.notes="Auto-scan failed: "+String(e.message||e).slice(0,120);item.conf=0}
 item.scanning=false;
}
async function addPhoto(f){
 let sh;try{sh=await shrink(f)}catch(e){toast("Couldn't read that image");return}
 const item={id:Date.now()+""+Math.random().toString(36).slice(2,6),name:"Scanning…",line:"",edition:"",rarity:"Common",price:0,status:"Owned",notes:"",img:sh.thumb,added:Date.now(),scanning:true};
 cans.push(item);render();
 enqueue(async()=>{await scanOne(item,sh.scan);save();render();showResult(item)});
}
function showResult(item){
 const hot=RAR.indexOf(item.rarity)>=2&&item.conf>0;
 navigator.vibrate&&navigator.vibrate(hot?[40,40,80]:30);
 if($("cam").classList.contains("open")){
  const b=document.createElement("button");b.className="res";
  b.innerHTML=`<img src="${item.img}" alt=""><div><b>${esc(item.name)}</b><small>${item.conf?item.rarity:"Check this one"}</small></div><b>${item.conf?money(item.price):""}</b>`;
  b.onclick=()=>{closeCam();openSheet(item.id)};$("tray").appendChild(b);
  while($("tray").children.length>3)$("tray").firstChild.remove();
  setTimeout(()=>b.remove(),6000);
 }else toast(item.conf?`${item.name} · ${item.rarity} · ${money(item.price)}`:"Couldn't identify that one. Tap it to fix.");
}

async function openCam(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("fileCam").click();return}
 camScans=0;$("camCount").textContent="0 scanned";$("tray").innerHTML="";$("cam").classList.add("open");
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  $("vid").srcObject=stream;await $("vid").play();
 }catch(e){closeCam();toast("Camera blocked. Using your phone camera app instead.");$("fileCam").click()}
}
function closeCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("vid").srcObject=null;$("cam").classList.remove("open")}
$("shutter").onclick=()=>{
 const v=$("vid");if(!v.videoWidth)return;
 const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
 const f=$("flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
 camScans++;$("camCount").textContent=camScans+" scanned";
 c.toBlob(b=>addPhoto(b),"image/jpeg",.9);
};
$("scanBtn").onclick=openCam;$("camClose").onclick=closeCam;
$("camGal").onclick=()=>$("file").click();$("gal").onclick=()=>$("file").click();
for(const id of["file","fileCam"])$(id).onchange=e=>{const fs=[...e.target.files];e.target.value="";if(fs.length){closeCam();fs.forEach(addPhoto)}};

function render(){
 const owned=cans.filter(c=>c.status!=="Wishlist"&&!c.scanning);
 const total=owned.reduce((a,c)=>a+c.price,0);
 $("sum").textContent=owned.length?`${owned.length} ${owned.length===1?"can":"cans"} · ${money(total)}`:"";
 const sums=RAR.map(r=>({r,n:owned.filter(c=>c.rarity===r).length,v:owned.filter(c=>c.rarity===r).reduce((a,c)=>a+c.price,0)}));
 const max=Math.max(1,...sums.map(s=>s.v));
 $("chart").innerHTML=owned.length?sums.map(s=>`<div class="bar"><span>${s.r} (${s.n})</span><div class="track"><div class="fill" style="width:${s.v/max*100}%;background:${COL[s.r]}"></div></div><small>${money(s.v)}</small></div>`).join(""):'<p class="note">Nothing to show yet.</p>';
 $("filters").innerHTML=["All",...RAR,"Wishlist"].map(f=>`<button class="chip${f===filter?" on":""}" data-f="${f}">${f}</button>`).join("");
 const q=$("q").value.trim().toLowerCase(),s=$("sort").value;
 let shown=cans.filter(c=>(filter==="All"||(filter==="Wishlist"?c.status==="Wishlist":c.rarity===filter))&&(!q||[c.name,c.line,c.edition,c.notes].join(" ").toLowerCase().includes(q)));
 shown.sort((a,b)=>s==="price"?b.price-a.price:s==="rarity"?RAR.indexOf(b.rarity)-RAR.indexOf(a.rarity):s==="name"?a.name.localeCompare(b.name):(b.added||0)-(a.added||0));
 $("list").innerHTML=shown.length?shown.map(c=>`<button class="card" data-o="${c.id}"><div class="ph">${c.img?`<img src="${c.img}" alt="${esc(c.name)}">`:"🥫"}${c.status==="Wishlist"?'<span class="wish">Wishlist</span>':""}${c.scanning?'<div class="scan">Scanning…</div>':""}</div><div class="info"><b>${esc(c.name)}</b><span><i class="dot" style="background:${COL[c.rarity]}"></i>${c.rarity} · ${money(c.price)}</span></div></button>`).join(""):'<div class="empty">No cans yet.<br>Tap Scan a can to begin.</div>';
}
$("q").oninput=render;$("sort").onchange=render;
$("filters").onclick=e=>{const f=e.target.dataset.f;if(f){filter=f;render()}};
$("list").onclick=e=>{const b=e.target.closest("[data-o]");if(b)openSheet(b.dataset.o)};

function openSheet(id){
 editId=id;const c=id?cans.find(x=>x.id===id):{name:"",line:"",edition:"",rarity:"Common",price:0,status:"Owned",notes:""};
 if(!c)return;
 $("panel").innerHTML=`${c.img?`<img src="${c.img}" alt="">`:""}
 ${c.conf!=null&&c.img?`<p class="note">Scan confidence ${c.conf}%. Prices are estimates, so check them.</p>`:""}
 <label for="f_name">Name</label><input id="f_name" value="${esc(c.name)}">
 <div class="row"><div><label for="f_line">Line</label><input id="f_line" value="${esc(c.line)}"></div><div><label for="f_ed">Edition</label><input id="f_ed" value="${esc(c.edition)}"></div></div>
 <div class="row"><div><label for="f_r">Rarity</label><select id="f_r">${RAR.map(r=>`<option${r===c.rarity?" selected":""}>${r}</option>`).join("")}</select></div>
 <div><label for="f_p">Price (₹)</label><input id="f_p" type="number" inputmode="decimal" min="0" step="0.01" value="${c.price}"></div></div>
 <label for="f_s">Status</label><select id="f_s"><option${c.status!=="Wishlist"?" selected":""}>Owned</option><option${c.status==="Wishlist"?" selected":""}>Wishlist</option></select>
 <label for="f_n">Notes</label><textarea id="f_n" rows="2">${esc(c.notes)}</textarea>
 <button class="primary" id="f_save" style="margin-top:12px">Save</button>
 <div class="row" style="margin-top:8px"><button id="f_close">Close</button>${id?'<button class="danger" id="f_del">Delete</button>':"<span></span>"}</div>`;
 $("sheet").classList.add("open");
 $("f_close").onclick=closeSheet;
 $("f_save").onclick=()=>{
  const v={name:$("f_name").value.trim()||"Unnamed can",line:$("f_line").value.trim(),edition:$("f_ed").value.trim(),rarity:$("f_r").value,price:Math.max(0,parseFloat($("f_p").value)||0),status:$("f_s").value,notes:$("f_n").value.trim()};
  if(id)Object.assign(c,v);else cans.push({id:Date.now()+"",added:Date.now(),...v});
  save();closeSheet();render();
 };
 if(id)$("f_del").onclick=()=>{if(confirm("Delete this can?")){cans=cans.filter(x=>x.id!==id);save();closeSheet();render()}};
}
function closeSheet(){$("sheet").classList.remove("open")}
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
$("manual").onclick=()=>openSheet(null);

$("exp").onclick=()=>{
 const u=URL.createObjectURL(new Blob([JSON.stringify(cans)],{type:"application/json"}));
 const l=document.createElement("a");l.href=u;l.download="can-vault-backup.json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
};
$("imp").onclick=()=>$("impFile").click();
$("impFile").onchange=async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const a=JSON.parse(await f.text());if(!Array.isArray(a))throw 0;
  const ids=new Set(cans.map(c=>c.id));a.forEach(c=>{if(c&&c.id&&!ids.has(c.id))cans.push(c)});save();render();toast("Backup imported")
 }catch(err){toast("That file isn't a Can Vault backup")}
};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
