<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Can Vault</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1511">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Can Vault">
<style>
:root{--bg:#f2f4ef;--surface:#fff;--ink:#16201a;--mute:#66726a;--line:#d9ded6;--acc:#5fae00;--acc-ink:#fff;
--common:#8a948c;--uncommon:#2f8f5b;--rare:#2b6fd6;--epic:#8a4bd6;--legendary:#e08a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--surface:#18201a;--ink:#e8efe9;--mute:#97a39a;--line:#2a352d;--acc:#8be000;--acc-ink:#0f1511;--common:#9aa59c;--uncommon:#46c27d;--rare:#5b9bff;--epic:#b57aff;--legendary:#ffb12e}}
:root[data-theme="dark"]{--bg:#0f1511;--surface:#18201a;--ink:#e8efe9;--mute:#97a39a;--line:#2a352d;--acc:#8be000;--acc-ink:#0f1511;--common:#9aa59c;--uncommon:#46c27d;--rare:#5b9bff;--epic:#b57aff;--legendary:#ffb12e}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{color:var(--mute);font-size:12px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;border:0;border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink);background:var(--bg)}
.primary{background:var(--acc);color:var(--acc-ink);font-weight:700;width:100%}
.big{padding:18px;font-size:18px;margin-bottom:14px}
.danger{color:#d23b3b}
:focus-visible{outline:3px solid var(--rare);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:grid;grid-template-columns:84px 1fr 60px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.track{background:var(--bg);border-radius:6px;height:18px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.bar small{color:var(--mute);text-align:right}
.tools{display:grid;grid-template-columns:1fr 130px;gap:8px;margin-bottom:8px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.chip{border:1px solid var(--line);padding:6px 12px;border-radius:99px;white-space:nowrap;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.ph{aspect-ratio:3/4;background:var(--line);position:relative;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:6px;top:6px;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.wish{position:absolute;right:6px;top:6px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:99px}
.info{padding:8px 10px}
.info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info span{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:18px 0;grid-column:1/-1}
.scan{position:absolute;inset:0;background:#000a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
#sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.panel img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;display:none}
.note{color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Can Vault</h1>
<p class="sub">Snap a can. Details fill in automatically.</p>

<div class="stats">
<div class="stat"><b id="sCount">0</b><span>Cans</span></div>
<div class="stat"><b id="sTotal">$0</b><span>Value</span></div>
<div class="stat"><b id="sAvg">$0</b><span>Average</span></div>
<div class="stat"><b id="sTop">–</b><span>Priciest</span></div>
</div>

<input type="file" id="file" accept="image/*" multiple hidden>
<button class="primary big" id="scanBtn">📷 Scan cans</button>
<p class="note" id="scanNote"></p>

<section>
<h2>Value by rarity</h2>
<div id="chart"></div>
</section>

<section>
<h2>Collection</h2>
<div class="tools">
<input id="q" type="search" placeholder="Search cans" aria-label="Search cans">
<select id="sort" aria-label="Sort"><option value="new">Newest</option><option value="price">Price</option><option value="rarity">Rarity</option><option value="name">Name</option></select>
</div>
<div class="filters" id="filters"></div>
<div class="grid" id="list"></div>
<button style="margin-top:12px;width:100%" id="manual">+ Add without a photo</button>
</section>

<section>
<h2>Backup</h2>
<p class="note">Cans are saved in this browser. Export a backup so you never lose them.</p>
<div class="row"><button id="exp">Export backup</button><button id="imp">Import backup</button></div>
<input type="file" id="impFile" accept="application/json" hidden>
</section>
</main>

<div id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
const RAR=["Common","Uncommon","Rare","Epic","Legendary"];
const COL={Common:"var(--common)",Uncommon:"var(--uncommon)",Rare:"var(--rare)",Epic:"var(--epic)",Legendary:"var(--legendary)"};
const $=id=>document.getElementById(id);
let cans=[],filter="All",sample=null,canImg=false,editId=null,busy=0;
try{cans=JSON.parse(localStorage.getItem("canvault")||"[]")}catch(e){cans=[]}
function save(){try{localStorage.setItem("canvault",JSON.stringify(cans));return true}catch(e){toast("Storage is full. Export a backup and delete some cans.");return false}}
const money=n=>"$"+(+n||0).toFixed(2).replace(/\.00$/,"");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}

sample=true;canImg=true;
function note(){$("scanNote").textContent="Select one or many photos. Prices are estimates, so check them."}
note();

function shrink(file,max=520){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res({blob:b,url:c.toDataURL("image/jpeg",.7)}),"image/jpeg",.8)};img.onerror=rej;img.src=u})}

async function scanOne(item){
 try{
  const r=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:item.img})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||"Scan failed");
 item.name=j.name||"Unknown can";item.line=j.line||"";item.edition=j.edition||"";
  item.rarity=RAR.includes(j.rarity)?j.rarity:"Common";item.price=Math.max(0,+j.price||0);
  item.notes=j.notes||"";item.conf=Math.round(+j.confidence||0);
 }catch(e){item.name="Unknown can";item.notes="Auto-scan failed. Tap to fill in details.";item.conf=0}
 item.scanning=false;
}
async function handleFiles(files){
 for(const f of files){
  const id=Date.now()+""+Math.random().toString(36).slice(2,6);
  let sh;try{sh=await shrink(f)}catch(e){toast("Couldn't read that image");continue}
  const item={id,name:"Scanning…",line:"",edition:"",rarity:"Common",price:0,status:"Owned",notes:"",img:sh.url,added:Date.now(),scanning:!!(sample&&canImg)};
  cans.push(item);render();
  if(item.scanning){busy++;await scanOne(item,sh.blob);busy--}else{item.name="New can"}
  save();render();
 }
 if(!busy)toast("Done. Tap a can to review it.");
}
$("scanBtn").onclick=()=>$("file").click();
$("file").onchange=e=>{const fs=[...e.target.files];e.target.value="";if(fs.length)handleFiles(fs)};

function render(){
 const owned=cans.filter(c=>c.status!=="Wishlist"&&!c.scanning);
 const total=owned.reduce((a,c)=>a+c.price,0);
 $("sCount").textContent=owned.length;$("sTotal").textContent=money(total);
 $("sAvg").textContent=money(owned.length?total/owned.length:0);
 const top=owned.reduce((a,c)=>!a||c.price>a.price?c:a,null);$("sTop").textContent=top?money(top.price):"–";
 const sums=RAR.map(r=>({r,n:owned.filter(c=>c.rarity===r).length,v:owned.filter(c=>c.rarity===r).reduce((a,c)=>a+c.price,0)}));
 const max=Math.max(1,...sums.map(s=>s.v));
 $("chart").innerHTML=owned.length?sums.map(s=>`<div class="bar"><span>${s.r} (${s.n})</span><div class="track"><div class="fill" style="width:${s.v/max*100}%;background:${COL[s.r]}"></div></div><small>${money(s.v)}</small></div>`).join(""):'<div class="note">Scan a can to see your chart.</div>';
 $("filters").innerHTML=["All",...RAR,"Wishlist"].map(f=>`<button class="chip${f===filter?" on":""}" data-f="${f}">${f}</button>`).join("");
 const q=$("q").value.trim().toLowerCase(),s=$("sort").value;
 let shown=cans.filter(c=>(filter==="All"||(filter==="Wishlist"?c.status==="Wishlist":c.rarity===filter))&&(!q||[c.name,c.line,c.edition,c.notes].join(" ").toLowerCase().includes(q)));
 shown.sort((a,b)=>s==="price"?b.price-a.price:s==="rarity"?RAR.indexOf(b.rarity)-RAR.indexOf(a.rarity):s==="name"?a.name.localeCompare(b.name):(b.added||0)-(a.added||0));
 $("list").innerHTML=shown.length?shown.map(c=>`<button class="card" data-o="${c.id}"><div class="ph">${c.img?`<img src="${c.img}" alt="${esc(c.name)}">`:"🥫"}<span class="badge" style="background:${COL[c.rarity]}">${c.rarity}</span>${c.status==="Wishlist"?'<span class="wish">Wishlist</span>':""}${c.scanning?'<div class="scan">Scanning…</div>':""}</div><div class="info"><b>${esc(c.name)}</b><span>${esc(c.line)}${c.line&&c.edition?" · ":""}${esc(c.edition)}${!c.line&&!c.edition?"&nbsp;":""}</span><br><b class="p">${money(c.price)}</b></div></button>`).join(""):'<div class="empty">No cans here yet. Tap Scan cans to start.</div>';
}
$("q").oninput=render;$("sort").onchange=render;
$("filters").onclick=e=>{const f=e.target.dataset.f;if(f){filter=f;render()}};
$("list").onclick=e=>{const b=e.target.closest("[data-o]");if(b)openSheet(b.dataset.o)};

function openSheet(id){
 editId=id;const c=id?cans.find(x=>x.id===id):{name:"",line:"",edition:"",rarity:"Common",price:0,status:"Owned",notes:""};
 if(!c)return;
 $("panel").innerHTML=`${c.img?`<img src="${c.img}" alt="">`:""}
 ${c.conf!=null&&c.img?`<p class="note">Scan confidence ${c.conf}%. Prices are estimates.</p>`:""}
 <label for="f_name">Name</label><input id="f_name" value="${esc(c.name)}">
 <div class="row"><div><label for="f_line">Line</label><input id="f_line" value="${esc(c.line)}"></div><div><label for="f_ed">Edition</label><input id="f_ed" value="${esc(c.edition)}"></div></div>
 <div class="row"><div><label for="f_r">Rarity</label><select id="f_r">${RAR.map(r=>`<option${r===c.rarity?" selected":""}>${r}</option>`).join("")}</select></div>
 <div><label for="f_p">Price ($)</label><input id="f_p" type="number" inputmode="decimal" min="0" step="0.01" value="${c.price}"></div></div>
 <label for="f_s">Status</label><select id="f_s"><option${c.status!=="Wishlist"?" selected":""}>Owned</option><option${c.status==="Wishlist"?" selected":""}>Wishlist</option></select>
 <label for="f_n">Notes</label><textarea id="f_n" rows="2">${esc(c.notes)}</textarea>
 <button class="primary" id="f_save" style="margin-top:12px">Save</button>
 <div class="row" style="margin-top:8px"><button id="f_close">Close</button>${id?'<button class="danger" id="f_del">Delete</button>':"<span></span>"}</div>`;
 $("sheet").classList.add("open");
 $("f_close").onclick=closeSheet;
 $("f_save").onclick=()=>{
  const v={name:$("f_name").value.trim()||"Unnamed can",line:$("f_line").value.trim(),edition:$("f_ed").value.trim(),rarity:$("f_r").value,price:Math.max(0,parseFloat($("f_p").value)||0),status:$("f_s").value,notes:$("f_n").value.trim()};
  if(id)Object.assign(c,v);else cans.push({id:Date.now()+"",added:Date.now(),...v});
  save();closeSheet();render();
 };
 if(id)$("f_del").onclick=()=>{if(confirm("Delete this can?")){cans=cans.filter(x=>x.id!==id);save();closeSheet();render()}};
}
function closeSheet(){$("sheet").classList.remove("open")}
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
$("manual").onclick=()=>openSheet(null);

$("exp").onclick=()=>{
 const u=URL.createObjectURL(new Blob([JSON.stringify(cans)],{type:"application/json"}));
 const l=document.createElement("a");l.href=u;l.download="can-vault-backup.json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
};
$("imp").onclick=()=>$("impFile").click();
$("impFile").onchange=async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const a=JSON.parse(await f.text());if(!Array.isArray(a))throw 0;
  const ids=new Set(cans.map(c=>c.id));a.forEach(c=>{if(c&&c.id&&!ids.has(c.id))cans.push(c)});save();render();toast("Backup imported")
 }catch(err){toast("That file isn't a Can Vault backup")}
};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
